<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        table {
            margin: 100px auto;
            border-collapse: collapse;
        }
        td {
            padding: 10px;
        }
        input[type="text"],
        input[type="password"] {
            width: 200px;
            padding: 5px;
        }
        input[type="submit"] {
            width: 100%;
            padding: 8px;
        }
    </style>
</head>
<body>

<form>
    <table border="1">
        <tr>
            <td>Username</td>
            <td><input type="text" name="username"></td>
        </tr>
        <tr>
            <td>Password</td>
            <td><input type="password" name="password"></td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <input type="submit" value="Login">
            </td>
        </tr>
    </table>
</form>

</body>
</html>
